name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }} # Optional
          script: |
            # Navigate to the project directory
            # Assuming the code is already cloned at this path on the VPS
            cd /var/www/caldimproducts/misc
            
            # Update code
            git pull origin master
            
            # --- Backend Deployment ---
            cd server
            npm install --production
            
            # Restart or Start the backend with PM2 on a specific port
            # We use a unique name 'misc-automation' and port 5001 to avoid conflicts
            pm2 restart misc-automation || pm2 start server.js --name misc-automation --env PORT=5001
            
            # --- Frontend Deployment ---
            cd ../client
            npm install
            npm run build
            
            # Success message
            echo "Deployment finished successfully!"
