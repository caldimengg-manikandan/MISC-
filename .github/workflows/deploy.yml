name: Deploy to VPS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── Build React Frontend on GitHub Runner (faster, no VPS RAM pressure) ──
      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Build React client for production
        working-directory: client
        env:
          NODE_ENV: production
          REACT_APP_API_URL: /misc
          CI: false  # Prevents treating warnings as errors
        run: npm run build

      # ── Deploy everything to VPS via SSH ──
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🚀 Starting deployment..."

            # Navigate to project root
            cd /var/www/misc

            # Pull latest code
            git pull origin master
            echo "✅ Code updated"

            # --- Backend & Process Management ---
            cd /var/www/misc
            npm install --prefix server --omit=dev
            echo "✅ Backend dependencies installed"

            # Restart PM2 using the ecosystem file for consistency
            pm2 startOrReload ecosystem.config.js --env production
            pm2 save
            echo "✅ Application restarted with PM2"

            echo "🏆 Deployment finished!"

      # ── Copy built frontend to VPS via SCP ──
      - name: Upload built client to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "client/build/*"
          target: "/var/www/misc/client/build/"
          strip_components: 2

      - name: Deployment success notification
        run: echo "✅ MISC app deployed to https://caldimproducts.com/misc"
